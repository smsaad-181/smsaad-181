name: Update GitHub Activity

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch: # allows manual trigger from GitHub Actions UI

jobs:
  update-readme:
    name: Update README with Recent Activity
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Actions pinned to commit SHAs so upstream changes can't alter what runs with write access
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Update GitHub Activity
        uses: jamesgeorge007/github-activity-readme@4aefbfa1c222d70537dc6a02f0519266aab2b1ea # v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "⚡ Auto-update: recent GitHub activity"
          MAX_LINES: 10
