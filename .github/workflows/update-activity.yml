name: Update GitHub Activity

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
  workflow_dispatch: # allows manual trigger from GitHub Actions UI

jobs:
  update-readme:
    name: Update README with Recent Activity
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Pinned to a commit SHA so upstream changes can't alter what runs with write access
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Update activity section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-activity.mjs

      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "⚡ Auto-update: recent GitHub activity"
          git push
