name: Update GitHub Metrics

on:
  schedule:
    # Runs once a day at 00:00 UTC (06:00 Dhaka)
    - cron: "0 0 * * *"
  workflow_dispatch: # allows manual trigger from GitHub Actions UI

jobs:
  metrics:
    name: Generate metrics (includes private repos)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Personal access token with "repo" + "read:user" scopes, saved as repo secret METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          user: smsaad-181
          filename: github-metrics.svg
          committer_message: "📊 Auto-update: GitHub metrics"
          config_timezone: Asia/Dhaka
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css
